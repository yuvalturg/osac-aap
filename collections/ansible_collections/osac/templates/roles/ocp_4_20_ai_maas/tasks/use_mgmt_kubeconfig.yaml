---
# Hack: use the existing management cluster kubeconfig instead of retrieving
# one from a HyperShift HostedCluster. Allows MaaS to be deployed on the
# mgmt cluster by skipping actual cluster creation.

- name: Read kubeconfig from KUBECONFIG env var
  ansible.builtin.set_fact:
    _mgmt_kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"

- name: Assert kubeconfig path is set
  ansible.builtin.assert:
    that:
      - _mgmt_kubeconfig_path | length > 0
    fail_msg: "KUBECONFIG env var is not set and ~/.kube/config not found"

- name: Load kubeconfig content
  ansible.builtin.set_fact:
    admin_kubeconfig: "{{ lookup('file', _mgmt_kubeconfig_path) | from_yaml }}"

- name: Set kubeconfig stats for access by other playbooks
  ansible.builtin.set_stats:
    data:
      admin_kubeconfig: "{{ admin_kubeconfig }}"
